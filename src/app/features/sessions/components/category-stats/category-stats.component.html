<div class="category-stats">
  <p class="category-stats__title">By category</p>

  <div class="category-stats__list">
    @for (slug of categoriesData(); track slug) {
      <div class="category-stats__item">
        <app-tag [label]="categoriesConfig[slug].label" [intent]="categoriesConfig[slug].intent" marker="dot"></app-tag>
        <span class="category-stats__count">{{ statsByCategory()?.[slug] }}</span>
      </div>
    }
  </div>
</div>
