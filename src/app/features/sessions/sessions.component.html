<div class="page sessions-page">
  <div class="sessions-page__header">
    <div>
      <h1>Study sessions</h1>
      <p>{{ sessionsResource.value()?.length }} sessions recorded</p>
    </div>
    <button type="button" class="btn" (click)="createSession()">
      <svg class="btn__icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      Add session
    </button>
  </div>

  <div class="sessions-page__container">
    <main class="sessions-page__main">
      <app-search [(value)]="searchQuery" placeholder="Search topics, notes, dates…" />

      <div class="sessions-page__list">
        @for (session of sessionsResource.value(); track session.id) {
          <app-session-card
            [session]="session"
            (sessionDelete)="deleteSession($event)"
            (sessionEdit)="editSession($event)"
          />
        }
      </div>
    </main>

    <aside class="sessions-page__sidebar">
      <app-streak-card [streak]="streak()" />

      <app-stats-card [sessions]="sessionsResource.value()"></app-stats-card>
      <app-category-stats [sessions]="sessionsResource.value() || []"></app-category-stats>
    </aside>
  </div>
</div>
<app-session-modal
  [title]="title()"
  [session]="selectedSession()"
  (sessionSaved)="onSessionSaved($event)"
  (modalClosed)="onModalClosed()"
></app-session-modal>
