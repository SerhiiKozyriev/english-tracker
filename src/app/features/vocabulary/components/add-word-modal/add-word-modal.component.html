<app-modal [title]="title()">
  <ng-container modal-body>
    <div class="input-group">
      <label class="input-label">Word</label>
      <input type="text" class="input" placeholder="e.g. Ubiquitous" [formField]="form.word" />
      @if (form.word().invalid() && form.word().touched()) {
        <div class="error">Word is required</div>
      }
    </div>

    <div class="input-group">
      <label class="input-label">Translation</label>
      <input type="text" class="input" placeholder="e.g. Вездесущий" [formField]="form.translation" />
      @if (form.translation().invalid() && form.translation().touched()) {
        <div class="error">Translation is required</div>
      }
    </div>

    <div class="input-group">
      <label class="input-label">Example sentence (optional)</label>
      <textarea
        class="input input-example"
        placeholder="Coffee shops are ubiquitous in this city."
        [formField]="form.example"
        rows="3"
      ></textarea>
    </div>
  </ng-container>

  <ng-container modal-footer>
    <button class="btn btn--secondary" (click)="close()">Cancel</button>
    <button class="btn btn--primary" (click)="saveWord()" [disabled]="form().invalid()">Save</button>
  </ng-container>
</app-modal>
