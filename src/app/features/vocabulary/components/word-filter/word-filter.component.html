<div class="word-filter">
  @for (option of filterOptions; track option.value) {
    <button
      type="button"
      class="word-filter__button"
      [class.word-filter__button--active]="value() === option.value"
      (click)="selectOption(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
